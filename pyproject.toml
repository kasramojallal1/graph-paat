[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-paat"
version = "0.1.0"
description = "Give an AI agent a small map of a codebase too large to read."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kasra Mojallal" }]
keywords = ["code-graph", "static-analysis", "ai-agents", "codebase-navigation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Parsing uses Python's own `ast` module, so reading a repository needs nothing
# installed. networkx is here for grouping only, and a build without it still
# produces the full graph -- it just cannot say what the main parts are.
# Python needs nothing: the standard library's own parser reads it. networkx
# is for grouping. Any other language needs a tree-sitter grammar, which is an
# extra so a Python-only user does not carry them.
dependencies = ["networkx>=3"]

[project.urls]
Homepage = "https://github.com/kasramojallal1/graph-paat"

[project.scripts]
graph-paat = "graphpaat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphpaat"]

[project.optional-dependencies]
dev = ["pytest>=7", "pypdf>=4"]
# Reading a PDF needs a PDF library. A repository with no PDFs should not have
# to carry one, so it is an extra exactly like the tree-sitter grammars.
pdf = ["pypdf>=4"]
go = ["tree-sitter>=0.21", "tree-sitter-go>=0.21"]
typescript = ["tree-sitter>=0.21", "tree-sitter-typescript>=0.21"]
javascript = ["tree-sitter>=0.21", "tree-sitter-javascript>=0.21"]
java = ["tree-sitter>=0.21", "tree-sitter-java>=0.21"]
csharp = ["tree-sitter>=0.21", "tree-sitter-c-sharp>=0.21"]
rust = ["tree-sitter>=0.21", "tree-sitter-rust>=0.21"]
ruby = ["tree-sitter>=0.21", "tree-sitter-ruby>=0.21"]
php = ["tree-sitter>=0.21", "tree-sitter-php>=0.21"]
swift = ["tree-sitter>=0.21", "tree-sitter-swift>=0.21"]
kotlin = ["tree-sitter>=0.21", "tree-sitter-kotlin>=0.21"]
bash = ["tree-sitter>=0.21", "tree-sitter-bash>=0.21"]
lua = ["tree-sitter>=0.21", "tree-sitter-lua>=0.21"]
c = ["tree-sitter>=0.21", "tree-sitter-c>=0.21"]
cpp = ["tree-sitter>=0.21", "tree-sitter-cpp>=0.21"]
# Reading C++ headers well needs the C++ grammar even in a C repository,
# so `c` and `cpp` are most useful together.
all = ["tree-sitter>=0.21", "tree-sitter-go>=0.21", "tree-sitter-typescript>=0.21", "tree-sitter-javascript>=0.21", "tree-sitter-java>=0.21", "tree-sitter-c-sharp>=0.21", "tree-sitter-rust>=0.21", "tree-sitter-ruby>=0.21", "tree-sitter-php>=0.21", "tree-sitter-swift>=0.21", "tree-sitter-kotlin>=0.21", "tree-sitter-bash>=0.21", "tree-sitter-lua>=0.21", "tree-sitter-c>=0.21", "tree-sitter-cpp>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
